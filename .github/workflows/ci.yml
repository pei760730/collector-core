name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # 實測最長 9.2 分、中位 0.4 分(近 18 次成功);不設就是吃 360 分鐘預設
    timeout-minutes: 20
    strategy:
      # engines >=20,而 consumer-bump 驗證跑 node 22 —— core 自己的 CI 只測 20 會漏掉
      # 「20 綠、22 紅」的缺口(bump 時才炸)。兩個版本都直接在這裡守。
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # typecheck 用 declaration:false,宣告檔限定錯誤(TS4023/TS2742 類)不會在上面兩步現形;
      # 少了這步,壞宣告的 PR 會綠著 merge,炸點延後到 release.mjs 本機 build 或消費端 npm ci 的 prepare。
      - run: npm run build

  # ── release gate ──────────────────────────────────────────────────────────
  # 補的是一個「全綠的靜默失敗」:core 的價值 100% 靠 tag 傳遞。若 src/ 或 contracts/ 改了
  # 進 main 卻沒發新版,collector 的 core-bump cron 會回報「已是最新,no-op」、兩邊 CI 全綠、
  # 沒有任何告警,而 collector 永遠吃舊碼 —— 看起來一切正常。這是本 repo 最貴的一種失敗。
  #
  # 守法:動到會進 dist 的東西(src/)或跨語言去重契約(contracts/),就必須在**同一支 PR**
  # 把 package.json 的 version 推過最新 tag。發版動作本身(打 tag)仍是人跑 `npm run release`,
  # 但「這是一次要發版的改動」這個決定被逼到 PR diff 上,不再靠事後記得。
  #
  # 只在 pull_request 跑:push 到 main 才檢查已經太遲(東西進去了),而 PR 上檢查的是
  # merge 後的狀態(checkout 預設抓 merge commit),擋得住。
  release-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整歷史 + tags 才能跟最新發版比對
      - name: 動到 src/contracts 就必須在同一支 PR bump version
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          LATEST=$(git tag --list 'v*' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            echo "尚無任何 tag,跳過(首次發版前)"; exit 0
          fi
          # 監看面 = 「會改變消費端拿到什麼」的三處:src/(編成 dist)、contracts/(隨包發布的
          # 跨語言去重向量)、tsconfig.json(決定 dist 怎麼編)。tests/ 與文件不進 dist,故不列入。
          WATCH="src contracts tsconfig.json"
          if git diff --quiet "$LATEST" HEAD -- $WATCH; then
            echo "✓ $WATCH 相對 $LATEST 無變更 —— 本 PR 不需要發版"; exit 0
          fi
          echo "本 PR(merge 後)相對 $LATEST 的變更:"
          git diff --stat "$LATEST" HEAD -- $WATCH
          CUR=$(node -p 'require("./package.json").version')
          TAG_V="${LATEST#v}"
          # 版號必須嚴格大於最新 tag。sort -V 取高者:高者若不是 CUR(或兩者相等)= 沒 bump。
          HI=$(printf '%s\n%s\n' "$CUR" "$TAG_V" | sort -V | tail -1)
          if [ "$CUR" = "$TAG_V" ] || [ "$HI" != "$CUR" ]; then
            echo "::error::src/ 或 contracts/ 有變更,但 package.json version=$CUR 沒有超前最新 tag $LATEST。消費端 collector 靠 git tag pin 取用 core —— 不 bump 版號這次改動永遠到不了它,而且沿路全綠、沒有任何告警。請在本 PR 把 version 改成新版號(merge 後跑 npm run release 打 tag)。"
            exit 1
          fi
          echo "✓ version $CUR > $LATEST —— merge 後跑 'npm run release' 即可發版"
